[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuya-pocket-buddy"
version = "0.1.0"
description = "BLE central + hook daemon that bridges Claude Code to a Tuya T5AI-Pocket buddy device."
requires-python = ">=3.10"
authors = [{ name = "TuyaOpen Project" }]
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
  "bleak>=0.22",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.8",
]

[project.scripts]
tuya-pocket-buddy = "tuya_pocket_buddy.__main__:main"

[tool.setuptools.packages.find]
include = ["tuya_pocket_buddy*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "W",  # pycodestyle warnings
  "B",  # flake8-bugbear
  "I",  # isort
  "UP", # pyupgrade
]
ignore = [
  "E501", # line length (ruff format is authoritative)
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
